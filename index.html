<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}
/* Monde unique : une nuit rose qui devient aube dorée. Mobile d'abord, colonne de 520px au maximum. */
:root {
  color-scheme: dark;
  --night-0: #14081c;
  --night-1: #2a0f38;
  --plum: #5b1e55;
  --rose: #ff7eb6;
  --rose-soft: #ffc2dd;
  --gold: #f6c667;
  --gold-deep: #c98a34;
  --cream: #fff3e6;
  --ink: #fff6ee;
  --muted: rgba(255, 238, 246, 0.74);
  --glass: rgba(30, 10, 42, 0.62);
  --glass-line: rgba(255, 214, 150, 0.28);
  --sky-top: rgb(18, 5, 26); --sky-mid: rgb(43, 14, 58); --sky-bot: rgb(74, 26, 77); --glow: 0; --cloud: rgba(255, 170, 215, 0.34);
  --ts: 1;
  --f-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-script: "Parisienne", "Brush Script MT", cursive;
  --f-ui: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(16px * var(--ts)); height: 100%; background: var(--night-0); }
body {
  margin: 0; height: 100%; background: var(--night-0); color: var(--ink);
  font-family: var(--f-ui); font-size: 1rem; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
img { max-width: 100%; }
h1, h2, h3, p { margin: 0; }
h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }

/* ---------- décor ---------- */
#sky { position: fixed; inset: 0; background:
  radial-gradient(75% 48% at 50% 108%, rgba(255, 205, 125, var(--glow)) 0%, rgba(255, 205, 125, 0) 72%),
  linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bot) 100%); }
#stars { position: fixed; left: 0; top: 0; width: 1px; height: 1px; border-radius: 50%; animation: twinkle 4.5s ease-in-out infinite; }
#clouds { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.cloud { position: absolute; left: 0; background:
  radial-gradient(38% 60% at 22% 62%, var(--cloud), transparent 72%),
  radial-gradient(34% 72% at 45% 40%, var(--cloud), transparent 72%),
  radial-gradient(36% 62% at 68% 58%, var(--cloud), transparent 72%),
  radial-gradient(28% 50% at 86% 66%, var(--cloud), transparent 72%);
  animation: drift linear infinite; will-change: transform; }
#rain { position: fixed; inset: 0; pointer-events: none; display: none; }
#codelines { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.codeline { position: absolute; top: 0; white-space: nowrap; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; color: #ff9ccb; text-shadow: 0 0 8px rgba(255, 126, 182, 0.7); animation: codefall linear forwards; }
#three { position: fixed; inset: 0; pointer-events: none; display: none; }
#vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(10, 2, 16, 0.55)); }

/* ---------- barre du haut ---------- */
#hud { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
body.no-hud #hud { display: none; }
.icon-btn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass); color: var(--cream); display: grid; place-items: center; padding: 0; backdrop-filter: blur(8px); }
.icon-btn svg { width: 22px; height: 22px; }
#gauge { flex: 1; min-width: 0; }
.g-row { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
.g-row b { color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; }
.g-bar { height: 8px; border-radius: 8px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
#gauge-fill { display: block; height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, var(--rose), var(--gold)); box-shadow: 0 0 14px rgba(246, 198, 103, 0.7); }

/* ---------- scène ---------- */
#stage { position: relative; z-index: 5; height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
  padding-block: 68px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.no-hud #stage { padding-top: 16px; }
#stage > section { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
#overlay-root { position: relative; z-index: 40; }
#modal-root { position: relative; z-index: 50; }

/* ---------- boutons ---------- */
.btn { appearance: none; border: 0; border-radius: 999px; padding: 0.85rem 1.5rem; min-height: 48px; font-weight: 600; font-size: 1rem; color: #3a1330;
  background: linear-gradient(135deg, #ffe7a1, #f4bb52); box-shadow: 0 6px 22px rgba(246, 198, 103, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.12s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; box-shadow: none; }
.btn.big { min-height: 56px; padding: 1rem 1.9rem; font-size: 1.1rem; }
.btn.mini { min-height: 36px; padding: 0.35rem 0.95rem; font-size: 0.88rem; }
.btn.ghost { background: transparent; color: var(--cream); border: 1px solid var(--glass-line); box-shadow: none; }
.link-btn { background: none; border: 0; color: var(--rose-soft); text-decoration: underline; text-underline-offset: 3px; padding: 10px 8px; min-height: 44px; font-size: 0.95rem; }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.btn-row[hidden], .btn[hidden] { display: none !important; }
.pill { padding: 0.35rem 0.85rem; border-radius: 999px; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-line); font-size: 0.9rem; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.gold { color: var(--gold); }
.small { font-size: 0.9rem; color: var(--muted); }
.center { text-align: center; }
.kicker { font-family: var(--f-display); font-style: italic; color: var(--gold); font-size: 1.15rem; }

/* ---------- feuilles (panneaux du bas) ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(10, 3, 16, 0.55); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.25s; }
.sheet-back.open { opacity: 1; }
.sheet { width: 100%; max-width: 520px; max-height: 90%; overflow-y: auto; overscroll-behavior: contain; background: linear-gradient(180deg, rgba(56, 21, 70, 0.98), rgba(30, 10, 42, 0.99));
  border: 1px solid var(--glass-line); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  transform: translateY(28px); transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1); user-select: none; }
.sheet-back.open .sheet { transform: none; }
.sheet h3 { font-size: 1.8rem; line-height: 1.1; margin-bottom: 0.5rem; }
.sheet p { margin-bottom: 0.6rem; line-height: 1.5; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sheet-note { color: var(--muted); font-size: 0.92rem; }
.group { margin: 14px 0; padding: 6px 12px; border-radius: 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 214, 150, 0.14); }
.group h4 { margin: 8px 0; color: var(--gold); font-weight: 600; font-size: 0.95rem; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; min-height: 52px; }
.row + .row { border-top: 1px solid rgba(255, 255, 255, 0.07); }
.row.col { flex-direction: column; align-items: stretch; }
.row-txt { display: flex; flex-direction: column; }
.row-txt small { color: var(--muted); font-size: 0.8rem; }
.switch { flex: 0 0 auto; width: 54px; height: 32px; border-radius: 32px; border: 0; background: rgba(255, 255, 255, 0.18); position: relative; padding: 0; transition: background 0.2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch[aria-checked="true"] { background: linear-gradient(135deg, var(--rose), var(--gold)); }
.switch[aria-checked="true"] i { transform: translateX(22px); }
input[type="range"] { width: 52%; accent-color: var(--gold); height: 32px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.seg button { flex: 1 1 auto; min-height: 44px; padding: 0.4rem 0.8rem; border-radius: 14px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, 0.06); font-size: 0.95rem; }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, #ffe7a1, #f4bb52); color: #3a1330; border-color: transparent; font-weight: 600; }
.credit { text-align: center; color: var(--muted); font-size: 0.82rem; margin-top: 8px; }
.tester-grid { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { min-height: 40px; padding: 0.3rem 0.9rem; border-radius: 12px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, 0.08); }
.map-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.map-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 14px; border-radius: 16px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, 0.06); text-align: left; }
.map-row:disabled { opacity: 0.4; }
.map-row.current { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.map-roman { font-family: var(--f-display); font-size: 1.4rem; width: 2.2rem; color: var(--gold); text-align: center; }
.map-name { flex: 1; font-weight: 500; }
.map-state { font-size: 0.8rem; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: min(92vw, 420px); padding: 12px 18px; border-radius: 16px; background: rgba(30, 10, 42, 0.94);
  border: 1px solid var(--glass-line); z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; text-align: center; font-size: 0.95rem; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- carte de chapitre ---------- */
.chapter-card { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; text-align: center;
  background: radial-gradient(70% 55% at 50% 48%, rgba(70, 22, 80, 0.9), rgba(14, 4, 22, 0.97)); opacity: 0; transition: opacity 0.5s; }
.chapter-card.in { opacity: 1; } .chapter-card.out { opacity: 0; }
.cc-roman { font-family: var(--f-display); font-style: italic; font-size: 1.3rem; color: var(--gold); margin-bottom: 0.6rem; }
.cc-title { font-size: clamp(2.2rem, 10vw, 3.2rem); line-height: 1.05; margin-bottom: 0.8rem; text-shadow: 0 0 40px rgba(255, 200, 110, 0.35); }
.cc-sub { color: var(--muted); font-size: 1.05rem; max-width: 26ch; margin: 0 auto; }
.cc-inner > * { animation: fadeup 0.9s both; } .cc-inner > :nth-child(2) { animation-delay: 0.15s; } .cc-inner > :nth-child(3) { animation-delay: 0.45s; }

/* ---------- intro ---------- */
.intro { align-items: center; justify-content: center; text-align: center; gap: 26px; position: relative; }
.intro-gate { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.intro-gate[hidden], .intro-phrase[hidden], .intro-actions[hidden], .skip[hidden] { display: none !important; }
.gate-kicker { font-family: var(--f-script); font-size: 2.6rem; color: var(--gold); text-shadow: 0 0 30px rgba(255, 200, 110, 0.5); }
.gate-orb { width: 140px; height: 140px; border-radius: 50%; border: 1px solid var(--glass-line); display: grid; place-items: center; padding: 0;
  background: radial-gradient(circle at 50% 38%, rgba(255, 214, 150, 0.28), rgba(30, 10, 42, 0.7)); box-shadow: 0 0 70px rgba(255, 126, 182, 0.5); animation: beat 1.7s ease-in-out infinite; }
.gate-orb svg { width: 74px; filter: drop-shadow(0 0 14px rgba(255, 126, 182, 0.8)); }
.gate-hint { font-size: 1.1rem; }
.gate-sound { color: var(--muted); font-size: 0.9rem; max-width: 26ch; }
.resume-actions { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.intro-phrase { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: clamp(2.1rem, 9.5vw, 3.2rem); line-height: 1.12; text-wrap: balance; text-shadow: 0 2px 30px rgba(20, 5, 30, 0.9); padding: 0 6px; }
.intro-phrase.first { font-family: var(--f-script); font-style: normal; font-size: clamp(4.4rem, 24vw, 7rem); color: var(--gold); }
.intro-phrase .w { display: inline-block; opacity: 0; transform: translateY(12px); filter: blur(6px); animation: wordin 0.9s forwards; }
.intro-phrase.out { opacity: 0; transition: opacity 0.5s; }
.skip { position: absolute; top: 4px; right: 0; background: none; border: 0; color: var(--muted); padding: 12px; min-height: 44px; }

/* ---------- chapitre I ---------- */
.lock { align-items: center; justify-content: center; text-align: center; gap: 16px; }
.lock-art { width: 148px; }
.lock-art svg { width: 100%; overflow: visible; }
#shackle { transition: transform 0.9s cubic-bezier(0.3, 1.5, 0.5, 1); }
.lock-art.open #shackle { transform: translateY(-20px) rotate(-30deg); }
.lock-art.open svg { filter: drop-shadow(0 0 26px rgba(255, 200, 110, 0.85)); }
.q { font-size: clamp(1.55rem, 7vw, 2rem); line-height: 1.18; text-wrap: balance; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.opts.stack { grid-template-columns: 1fr; }
.opt { min-height: 56px; border-radius: 16px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, 0.08); color: var(--cream); font-size: 1.05rem; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0.7rem 1rem; text-align: center; transition: transform 0.12s, background 0.2s; }
.opts.stack .opt { justify-content: flex-start; text-align: left; }
.opt:active:not(:disabled) { transform: scale(0.98); }
.opt .ltr { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 214, 150, 0.2); color: var(--gold); font-weight: 600; font-size: 0.9rem; }
.opt.right { background: linear-gradient(135deg, #ffe7a1, #f4bb52); color: #3a1330; border-color: transparent; }
.opt.right .ltr { background: rgba(58, 19, 48, 0.15); color: #3a1330; }
.opt.wrong { animation: shake 0.5s; border-color: #ff6b8a; background: rgba(255, 80, 120, 0.25); }
.opt:disabled:not(.right) { opacity: 0.45; }
.msg { min-height: 1.7em; text-align: center; color: var(--rose-soft); font-style: italic; font-family: var(--f-display); font-size: 1.2rem; line-height: 1.3; }
.msg.ok { color: var(--gold); }

/* ---------- chapitre II ---------- */
.maze { gap: 8px !important; }
.maze-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.maze-wrap { position: relative; flex: 1; min-height: 0; touch-action: none; }
.maze-wrap canvas { position: absolute; border-radius: 6px; }
.dpad { display: grid; grid-template-columns: repeat(3, 66px); grid-template-rows: repeat(2, 54px); gap: 6px; justify-content: center; }
.dp { border-radius: 18px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, 0.1); display: grid; place-items: center; padding: 0; touch-action: none; }
.dp.on { background: rgba(246, 198, 103, 0.35); }
.dp.up { grid-column: 2; grid-row: 1; } .dp.left { grid-column: 1; grid-row: 2; } .dp.down { grid-column: 2; grid-row: 2; } .dp.right { grid-column: 3; grid-row: 2; }
.dp i { width: 0; height: 0; border: 9px solid transparent; }
.dp.up i { border-bottom: 14px solid var(--gold); border-top: 0; } .dp.down i { border-top: 14px solid var(--gold); border-bottom: 0; }
.dp.left i { border-right: 14px solid var(--gold); border-left: 0; } .dp.right i { border-left: 14px solid var(--gold); border-right: 0; }
.maze-tip { text-align: center; font-size: 0.82rem; color: var(--muted); }
@media (max-height: 700px) { .maze-tip { display: none; } .dpad { grid-template-rows: repeat(2, 46px); } }
.end-av { display: flex; justify-content: center; margin-bottom: 8px; }
.end-av img { width: 78px; height: 78px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; box-shadow: 0 0 24px rgba(246, 198, 103, 0.5); }
.end-av img + img { margin-left: -14px; }
.end-card, .story { text-align: center; }
.story-lines p { opacity: 0; animation: fadeup 0.8s forwards; font-size: 1.2rem; margin: 0.35rem 0; font-family: var(--f-display); font-style: italic; }
.gate-q h3 { font-size: 1.7rem; margin: 0.2rem 0 1rem; }
.gate-q .msg { margin-top: 12px; }

/* ---------- chapitre III ---------- */
.defense { gap: 8px !important; }
.df-top { display: flex; align-items: center; gap: 12px; }
.lives { display: flex; gap: 3px; flex: 0 0 auto; }
.lives svg { width: 22px; height: 22px; }
.lives .on { fill: #ff5c9d; filter: drop-shadow(0 0 6px #ff5c9d); } .lives .off { fill: rgba(255, 255, 255, 0.2); }
.df-level { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--muted); }
#df-lvname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--gold)); transition: width 0.3s; }
.df-wrap { flex: 1; min-height: 0; position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--glass-line); touch-action: none; }
.df-wrap canvas { display: block; }
.df-powers { display: flex; gap: 10px; }
.power { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 12px; border-radius: 18px; border: 1px solid var(--glass-line); background: var(--glass); text-align: left; }
.power:disabled { opacity: 0.7; }
.power .pl { font-size: 0.92rem; font-weight: 500; }
.ring { --p: 0%; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; position: relative; display: grid; place-items: center; background: conic-gradient(var(--gold) var(--p), rgba(255, 255, 255, 0.14) 0); color: var(--gold); }
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #2a1036; }
.ring svg { position: relative; width: 22px; height: 22px; }
.power.ready { border-color: var(--gold); box-shadow: 0 0 22px rgba(246, 198, 103, 0.55); animation: beat 1.1s ease-in-out infinite; opacity: 1; }
.power.active { border-color: var(--rose); box-shadow: 0 0 22px rgba(255, 126, 182, 0.6); }

/* ---------- chapitre IV ---------- */
.games { gap: 10px !important; }
.hub { display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: center; }
.hub-title { font-size: 1.7rem; text-align: center; line-height: 1.15; }
.hub-list { display: flex; flex-direction: column; gap: 12px; }
.hub-card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; min-height: 80px; border-radius: 20px; border: 1px solid var(--glass-line); background: var(--glass); text-align: left; backdrop-filter: blur(6px); }
.hub-card.done { border-color: var(--gold); }
.hub-ico { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: rgba(246, 198, 103, 0.16); color: var(--gold); }
.hub-ico svg { width: 26px; height: 26px; fill: currentColor; }
.hub-txt { flex: 1; display: flex; flex-direction: column; min-width: 0; } .hub-txt b { font-weight: 600; font-size: 1.1rem; } .hub-txt small { color: var(--muted); }
.hub-state { font-size: 0.85rem; color: var(--gold); }
.g-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.g-title { text-align: center; font-family: var(--f-display); font-size: 1.5rem; font-style: italic; }
.mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mem-card { position: relative; aspect-ratio: 3 / 4; perspective: 700px; border: 0; background: none; padding: 0; }
.mem-card .face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform 0.45s; background-size: cover; }
.mem-card .back { background: linear-gradient(135deg, #7a2a62, #3a1346); border: 1px solid var(--glass-line); display: grid; place-items: center; }
.mem-card .back svg { width: 42%; fill: var(--gold); }
.mem-card .front { transform: rotateY(180deg); }
.mem-card.open .back { transform: rotateY(180deg); } .mem-card.open .front { transform: rotateY(0); }
.mem-card.matched .front { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(246, 198, 103, 0.7); }
.ct-wrap { flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--glass-line); touch-action: none; }
.ct-wrap canvas { display: block; }
.pz-board { position: relative; margin: 4px auto; border-radius: 14px; overflow: hidden; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-line); touch-action: manipulation; }
.pz-tile { position: absolute; left: 0; top: 0; padding: 0; border: 1px solid rgba(255, 255, 255, 0.3); background-repeat: no-repeat; transition: transform 0.22s ease; }
.pz-tile.last { animation: fadeup 0.6s both; }
.pz-board.solved .pz-tile { border-color: transparent; }
.pz-peek { position: absolute; inset: 0; z-index: 3; background-size: cover; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
.pz-peek.on { opacity: 1; }

/* ---------- chapitre V ---------- */
.memories { position: relative; }
.mem-intro { text-align: center; color: var(--muted); font-size: 0.95rem; }
.flow { flex: 1; min-height: 0; display: flex; align-items: center; gap: 14px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px 0; }
.flow::-webkit-scrollbar { display: none; }
.flow-pad { flex: 0 0 calc((100% - min(72vw, 300px)) / 2 - 14px); }
.card { flex: 0 0 min(72vw, 300px); scroll-snap-align: center; margin: 0; border-radius: 20px; overflow: hidden; background: #2a0f38; border: 1px solid var(--glass-line); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), 0 0 0 4px rgba(246, 198, 103, 0.16); will-change: transform; }
.card .ph { height: min(calc(min(72vw, 300px) * 1.3), 48vh); background-size: cover; position: relative; }
.card figcaption { padding: 12px 14px 14px; font-family: var(--f-display); font-style: italic; font-size: 1.15rem; line-height: 1.25; text-align: center; min-height: 4.2rem; display: grid; place-items: center; }
.play { position: absolute; inset: 0; margin: auto; width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--gold); background: rgba(30, 10, 42, 0.55); display: grid; place-items: center; padding: 0; }
.play svg { width: 30px; fill: var(--gold); }
.dots { display: flex; justify-content: center; gap: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.25); transition: all 0.2s; }
.dots i.on { width: 22px; border-radius: 8px; background: var(--gold); }
.secret-heart { position: absolute; right: 2px; bottom: 96px; width: 34px; height: 34px; background: none; border: 0; padding: 6px; opacity: 0.3; animation: beat 2.6s ease-in-out infinite; }
.secret-heart svg { width: 100%; fill: var(--gold); }
.secret-heart.found { opacity: 0.75; fill: var(--rose); }
.lightbox { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.lightbox img, .lightbox video { width: 100%; max-height: 62vh; object-fit: contain; border-radius: 16px; background: #000; }
.lightbox p { font-family: var(--f-display); font-style: italic; font-size: 1.2rem; }

/* ---------- chapitre VI ---------- */
.paper { flex: 1; min-height: 0; overflow-y: auto; background: linear-gradient(180deg, #fff4e3, #f7dfc8); color: #4a2238; border-radius: 10px 10px 20px 20px; padding: 24px 22px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 0 60px rgba(201, 138, 52, 0.18); user-select: text; -webkit-user-select: text; }
.paper p { font-family: var(--f-display); font-size: 1.32rem; line-height: 1.5; margin-bottom: 0.9rem; font-weight: 500; }
.paper p.greet { font-family: var(--f-script); font-size: 2.5rem; color: #a02b5e; line-height: 1.1; }
.paper p.sign { font-family: var(--f-script); font-size: 2.4rem; color: #a02b5e; text-align: right; }
.cp-title { font-size: 1.8rem; text-align: center; }
.cp-list { display: grid; gap: 12px; }
.coupon { position: relative; height: 96px; border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-line); }
.cp-under { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 18px; background: linear-gradient(135deg, #5b1e55, #c4547f); }
.cp-under b { font-family: var(--f-display); font-size: 1.35rem; font-weight: 600; } .cp-under small { color: var(--rose-soft); }
.cp-foil { position: absolute; inset: 0; touch-action: none; }
.cp-hint { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: #6b3f17; font-weight: 600; letter-spacing: 0.04em; }

/* ---------- final ---------- */
.finale { text-align: center; }
.fin-spacer { flex: 0 0 min(46%, 340px); }
.fin-text { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.fin-date { font-family: var(--f-display); font-style: italic; color: var(--gold); font-size: 1.15rem; animation: fadeup 1s both; animation-delay: 0.6s; }
.fin-title { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.05; animation: fadeup 1s both; animation-delay: 1.1s; }
.fin-name { font-family: var(--f-script); font-size: clamp(4.6rem, 25vw, 7rem); color: var(--gold); line-height: 0.95; text-shadow: 0 0 40px rgba(255, 200, 110, 0.65); animation: fadeup 1.2s both; animation-delay: 1.6s; }
.fin-line { margin-top: 10px; min-height: 4.2em; max-width: 24ch; font-family: var(--f-display); font-style: italic; font-size: 1.35rem; line-height: 1.3; text-wrap: balance; }
.fin-line.in { animation: wordin 0.9s both; }
.fin-actions { display: flex; flex-direction: column; gap: 10px; align-items: stretch; margin-top: 10px; animation: fadeup 0.8s both; }
.fin-actions[hidden] { display: none; }
.cert { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.cert img { width: 100%; max-height: 66vh; object-fit: contain; border-radius: 12px; user-select: auto; -webkit-user-select: auto; -webkit-touch-callout: default; }
.countdown { align-items: center; justify-content: center; text-align: center; gap: 14px; }
.cd-time { font-family: var(--f-display); font-size: clamp(2.6rem, 14vw, 4rem); color: var(--gold); font-variant-numeric: tabular-nums; text-shadow: 0 0 30px rgba(255, 200, 110, 0.5); }

/* ---------- animations ---------- */
@keyframes drift { from { transform: translateX(-60vw); } to { transform: translateX(120vw); } }
@keyframes twinkle { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.45; } }
@keyframes codefall { 0% { transform: translateY(-8vh); opacity: 0; } 10% { opacity: 0.85; } 85% { opacity: 0.55; } 100% { transform: translateY(108vh); opacity: 0; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes wordin { to { opacity: 1; transform: none; filter: none; } }
.fin-line.in { opacity: 0; transform: translateY(10px); filter: blur(5px); }
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
.reduce-motion .cloud { animation: none; transform: translateX(10vw); }
@media (prefers-reduced-motion: reduce) { .cloud { animation-duration: 400s; } }
.pz-tile.hint { z-index: 2; box-shadow: 0 0 0 3px #ffd978, 0 0 22px 6px rgba(255, 217, 120, 0.85); animation: pzpulse 0.9s ease-in-out infinite alternate; }
@keyframes pzpulse { from { filter: brightness(1); } to { filter: brightness(1.35); } }
.cd-time.pulse { animation: cdpulse .9s ease-out; }
@keyframes cdpulse { from { transform: scale(1.35); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.cd-time { font-size: clamp(4.5rem, 30vw, 8rem); }
</style>
